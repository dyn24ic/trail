services:
  django:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env.backend
    environment:
      DB_PATH: /app/db/trail.db
    volumes:
      - shared-db:/app/db
    restart: unless-stopped

  scala:
    build:
      context: ./backend
      dockerfile: Dockerfile.scala
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /app/db/trail.db
    volumes:
      - shared-db:/app/db
    depends_on:
      - django
    restart: unless-stopped

  nextjs:
    build:
      context: ./app
      args:
        BACKEND_URL: http://django:8000
    ports:
      - "3001:3000"
    env_file: .env.frontend
    environment:
      BACKEND_URL: http://django:8000
      SCALA_URL: http://scala:8080
    depends_on:
      - django
      - scala
    restart: unless-stopped

volumes:
  shared-db:
